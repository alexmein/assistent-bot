name = "assistent-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Alle 5 Minuten: Erinnerungen und geplante Läufe (Berliner Zeit, src/schedule.ts); Mail-Eingang jede Viertelstunde
[triggers]
crons = ["*/5 * * * *"]

# Verarbeitete Gmail-IDs (30 Tage), damit keine Mail doppelt abgelegt wird
[[kv_namespaces]]
binding = "MAIL_SEEN"
id = "4016159c7cd54d38bd6d9e810e1e9d35"

# Zeitpläne (Phase 3): welcher geplante Lauf heute schon erledigt ist
[[kv_namespaces]]
binding = "STATE"
id = "6967f08f5b3a4bb7b698f4db2de2f52b"

[vars]
GITHUB_REPO = "alexmein/Assistent"
DRIVE_ROOT_ID = "1sGrt7mDdj2E-525nJnMSLBpkwi0lcseN"

# Secrets (nie hier, nur per `wrangler secret put`):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, ALLOWED_CHAT_ID, GITHUB_TOKEN, ANTHROPIC_API_KEY,
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN,
#   MAIL_FORWARD_ADDRESS (Plus-Adresse, an die iCloud weiterleitet),
#   HC_GITHUB_TOKEN (nur lesen: hc-system, hc-kitchen, hc-orders, hc-shopify)
